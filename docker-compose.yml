# One command: docker compose up --build
# postgres + local model -> pipeline (Dagster job, exits) -> api, dashboard, Dagster UI, MLflow UI
x-app: &app
  build: .
  image: insolvency-file:dev
  user: "${UID:-1000}:${GID:-1000}"
  environment: &env
    HOME: /tmp
    AZURE_DI_ENDPOINT: ${AZURE_DI_ENDPOINT:-}
    AZURE_DI_KEY: ${AZURE_DI_KEY:-}
    AZURE_DI_MODEL: ${AZURE_DI_MODEL:-prebuilt-read}
    DATABASE_URL: postgresql://f2f:f2f@postgres:5432/f2f
    PGHOST: postgres
    LLM_URL: http://llm:11434
    LLM_MODEL: qwen2.5-1.5b-instruct
    DAGSTER_HOME: /app/data/dagster_home
    MLFLOW_TRACKING_URI: sqlite:////app/data/mlflow.db
  volumes:
    - ./data:/app/data
    - ./results:/app/results

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: f2f
      POSTGRES_PASSWORD: f2f
      POSTGRES_DB: f2f
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f2f -d f2f"]
      interval: 3s
      retries: 40

  # Small open model served locally. The weights are fetched once into ./models and
  # registered with Ollama. Client data never leaves the machine.
  llm:
    image: ollama/ollama:0.12.6
    entrypoint: ["/bin/sh", "/scripts/llm-entrypoint.sh"]
    environment:
      MODEL_NAME: qwen2.5-1.5b-instruct
      MODEL_FILE: qwen2.5-1.5b-instruct-q4_k_m.gguf
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
    volumes:
      - ./models:/models
      - ./scripts:/scripts:ro
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "test -f /root/.ollama/ready"]
      interval: 5s
      retries: 120

  pipeline:
    <<: *app
    command: sh scripts/run-pipeline.sh
    depends_on:
      postgres: {condition: service_healthy}
      llm: {condition: service_healthy}

  api:
    <<: *app
    command: uvicorn filepipe.api:app --host 0.0.0.0 --port 8200
    ports: ["8200:8200"]
    depends_on:
      pipeline: {condition: service_completed_successfully}

  dashboard:
    <<: *app
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8701 --server.headless true --client.toolbarMode minimal --browser.gatherUsageStats false
    ports: ["8701:8701"]
    depends_on:
      pipeline: {condition: service_completed_successfully}

  dagster-ui:
    <<: *app
    command: dagster-webserver -m orchestration.definitions -h 0.0.0.0 -p 3200
    ports: ["3200:3200"]
    depends_on:
      pipeline: {condition: service_completed_successfully}

  mlflow:
    <<: *app
    command: mlflow ui --backend-store-uri sqlite:////app/data/mlflow.db --host 0.0.0.0 --port 5200
    ports: ["5200:5200"]
    depends_on:
      pipeline: {condition: service_completed_successfully}

volumes:
  pgdata:
  ollama:
